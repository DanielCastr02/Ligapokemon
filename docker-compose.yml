version: '3'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app 
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_USER: danielcastro
      DB_NAME: ligapokemon
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"  
    volumes:
      - ./frontend:/app 
    networks:
      - app-network

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: danielcastro
      POSTGRES_DB: ligapokemon
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
